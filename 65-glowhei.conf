<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GlowHei fontconfig rules.

  To the extent possible under law, The GlowHei Authors have waived all
  copyright and related or neighbouring rights to this file. Licensed under
  CC0 1.0 Universal; the full text is in LICENSE-CC0. Copy it, change it, ship
  it, no attribution needed.

  SPDX-License-Identifier: CC0-1.0
-->
<fontconfig>

  <!-- Monospace classification.

       fontconfig derives spacing from advance widths, so a half-width ASCII
       beside full-width ideographs comes out FC_DUAL (90), not FC_MONO (100).
       Pango accepts 90; Qt and TDE require 100 and leave the face out of their
       fixed-width lists. Neither post.isFixedPitch nor PANOSE is consulted, so
       this cannot be fixed inside the font.

       The same derivation errs at the other end. Ext A carries Extension A
       and nothing else, every glyph in it is full width, and so every advance
       in it is the same. That reads as FC_MONO (100) and puts a fallback face
       nobody selects into the same fixed-width lists, as a choice that draws
       nothing at all for ordinary text. Ext A is not a monospace typeface.

       At scan time, because those lists are built from the cache. Run
       `fc-cache -f` after installing this file. -->

  <match target="scan">
    <test name="family"><string>GlowHei Mono</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>GlowHei GB Mono</string></test>
    <edit name="spacing" mode="assign"><const>mono</const></edit>
  </match>
  <match target="scan">
    <test name="family"><string>GlowHei ExtA</string></test>
    <edit name="spacing" mode="assign"><const>proportional</const></edit>
  </match>

  <!-- Rendering.

       The outlines carry their own instructions, and hintfull is what runs
       them: hintslight would substitute FreeType's autohinter and discard
       them. Antialiasing stays on at every size - there are no embedded
       bitmaps here to keep sharp. -->

  <match target="font">
    <test name="family" compare="contains"><string>GlowHei</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>

  <!-- Ext A is a fallback, not a family anyone selects. Appended weakly so a
       character outside CP936 resolves instead of becoming a box. -->

  <match target="pattern">
    <test name="family" compare="contains"><string>GlowHei</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>GlowHei ExtA</string>
    </edit>
  </match>

  <!-- Generic classification.

       Each face says which generic it belongs to, so that a picker filtering
       by generic finds it. Miss one and fontconfig treats it as unclassified,
       then presses it into service as some other generic.

       There is deliberately no <prefer> here. Installing a font should not
       decide what the desktop's default sans is; that is the
       user's setting to make. -->

  <alias>
    <family>GlowHei</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>GlowHei GB</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>GlowHei ExtA</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>GlowHei Mono</family>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>GlowHei GB Mono</family>
    <default><family>monospace</family></default>
  </alias>

  <!-- Old family names. Documents and pages that hard-code them are common
       enough that without these the font may as well not be installed. -->

  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowHei</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>GlowHei</string>
    </edit>
  </match>

</fontconfig>
